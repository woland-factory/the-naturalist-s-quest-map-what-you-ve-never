name: the-naturalist-s-quest-map-what-you-ve-never-staging
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: the-naturalist-s-quest-map-what-you-ve-never-staging-web
    expose:
      - "80"
    environment:
      PORT: "80"
      INAT_API_BASE: ${INAT_API_BASE:-https://api.inaturalist.org/v1}
      INAT_RATE_LIMIT_RPS: ${INAT_RATE_LIMIT_RPS:-1}
      INAT_USER_AGENT: ${INAT_USER_AGENT:-naturalist-quest-map (staging)}
      # Staging shows the differentiator on first load with no hand input.
      SEED_DEMO: "1"
      SEED_DEMO_LOGIN: ${SEED_DEMO_LOGIN:-kueda}
      SEED_DEMO_PLACE_ID: ${SEED_DEMO_PLACE_ID:-14}
      SEED_DEMO_PLACE_NAME: ${SEED_DEMO_PLACE_NAME:-California}
      SEED_DEMO_MONTH: ${SEED_DEMO_MONTH:-9}
      SENTRY_DSN: ${SENTRY_DSN:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_URL: ${UMAMI_URL:-}
    networks:
      - default
      - staging
    mem_limit: 512m
    oom_score_adj: 800
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  staging:
    external: true
    name: factory-staging-net
